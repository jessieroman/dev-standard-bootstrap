# git-cliff config — generates CHANGELOG.md and picks semver tags from
# Conventional Commits history (enforced by lefthook's commit-msg check).
#
#   git cliff --tag <version> -o CHANGELOG.md
#   git tag -a <version> -m "<version>"

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- if commit.breaking %} **BREAKING**{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\)", skip = true },
  # Renovate emits "chore(deps): ...". Keep pin bumps visible in the
  # changelog; [bump] still refuses to bump on type "chore".
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^build|^ci", group = "Build system" },
  { message = "^revert", group = "Reverts" },
]
filter_commits = false
tag_pattern = "v?[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

[bump]
# next_version matches this against the commit TYPE alone ("docs", not
# "docs: ..."), so anchor both ends. ponytail: the type check never sees
# "!", so a breaking change must use feat!/fix!/refactor!, never chore!.
no_increment_regex = "^(chore|ci|docs|style|test|build)$"
